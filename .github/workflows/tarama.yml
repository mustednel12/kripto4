name: Kripto Tarama Botu

on:
  schedule:
    # Her saat başı çalışır (Zaman dilimini değiştirmek istersen bu satırı düzenleyebilirsin)
    - cron: '0 * * * *'
  workflow_dispatch: # Actions sekmesinden manuel tetiklemene olanak tanır

jobs:
  tara:
    runs-on: ubuntu-latest
    
    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Tarama Botunu Çalıştır
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python kripto.py
